
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PE Faculty Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#1c2940}
aside{width:245px;background:#172642;color:white;position:fixed;inset:0 auto 0 0;padding:22px 14px;overflow:auto}
aside h2{font-size:20px;margin:0 0 6px}
aside p{font-size:12px;color:#b8c7df;margin-bottom:25px}
nav button{display:block;width:100%;border:0;background:none;color:#e0e8f6;text-align:left;padding:13px;border-radius:8px;cursor:pointer;margin:3px 0}
nav button:hover,nav button.active{background:#344a70}
main{margin-left:245px;padding:30px;max-width:1500px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0 0 8px;font-size:28px}
.subtitle{color:#718097;margin:0 0 25px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.card,.panel{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 10px #1425400c}
.card{cursor:pointer}
.card:hover{box-shadow:0 5px 18px #14254020}
.card h3{margin:10px 0}
.card p,.muted{color:#718097;font-size:14px}
.panel{margin-top:20px}
input,select{padding:11px;border:1px solid #d4dce8;border-radius:7px;max-width:100%}
input{width:100%}
.form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;margin:15px 0}
button.primary{background:#2758a5;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer}
button.small{padding:7px 10px;border:1px solid #d7dfeb;background:white;border-radius:6px;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f5}
.item:last-child{border:0}
.item a{color:#2256a5;overflow-wrap:anywhere}
.item span{font-size:13px;color:#718097}
.item .details{flex:1;min-width:0}
.item .details strong{display:block;margin-bottom:5px}
.actions{display:flex;gap:7px;align-items:center}
.done{text-decoration:line-through;color:#8793a6}
@media(max-width:700px){
aside{position:static;width:100%;padding:15px}
aside p{margin-bottom:10px}
nav{display:flex;overflow-x:auto}
nav button{min-width:140px}
main{margin:0;padding:18px}
.form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside>
<h2>🎓 PE Faculty Hub</h2>
<p>Academic Year 2026–2027</p>
<nav id="menu"></nav>
</aside>
<main>
<header>
<div>
<h1 id="heading">Dashboard</h1>
<p class="subtitle" id="subtitle">Your personal teaching workspace</p>
</div>
</header>
<div id="content"></div>
</main>
<script>
const sections=[
["Dashboard","🏠"],
["Learning Guides","📚"],
["Class Records","📊"],
["Students","👥"],
["Forms & Rubrics","📋"],
["To-Do List","✅"],
["Calendar","📅"],
["File Directory","📁"],
["Settings","⚙️"]
];
const KEY="peFacultyHubV2";
const empty={guides:[],forms:[],tasks:[],events:[]};
let data;
try{
data={...empty,...JSON.parse(localStorage.getItem(KEY)||"{}")};
}catch(e){data={...empty};}
let current="Dashboard";
const menu=document.getElementById("menu");
const content=document.getElementById("content");
function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}
function el(tag,text,cls){
const node=document.createElement(tag);
if(text!==undefined)node.textContent=text;
if(cls)node.className=cls;
return node;
}
function button(text,action,cls="small"){
const b=el("button",text,cls);
b.onclick=action;
return b;
}
sections.forEach(([name,icon])=>{
menu.appendChild(button(icon+" "+name,()=>show(name)));
});
function show(name){
current=name;
document.getElementById("heading").textContent=name;
document.getElementById("subtitle").textContent=
name==="Dashboard"?"Your personal teaching workspace":
"Manage your "+name.toLowerCase();
[...menu.children].forEach((b,i)=>{
b.className=sections[i][0]===name?"active":"";
});
content.replaceChildren();
if(name==="Dashboard")dashboard();
else if(name==="Learning Guides")links("guides","Learning Guides");
else if(name==="Forms & Rubrics")links("forms","Forms & Rubrics");
else if(name==="File Directory")directory();
else if(name==="To-Do List")tasks();
else if(name==="Calendar")events();
else if(name==="Settings")settings();
else placeholder(name);
}
function panel(title){
const p=el("section",undefined,"panel");
p.appendChild(el("h2",title));
content.appendChild(p);
return p;
}
function dashboard(){
const grid=el("div",undefined,"cards");
const cards=[
["Learning Guides","📚",data.guides.length+" resources"],
["Class Records","📊","Coming soon"],
["Students","👥","Coming soon"],
["Forms & Rubrics","📋",data.forms.length+" resources"],
["To-Do List","✅",data.tasks.filter(t=>!t.done).length+" pending"],
["Calendar","📅",data.events.length+" events"],
["File Directory","📁","All saved links"]
];
cards.forEach(([name,icon,desc])=>{
const c=el("div",undefined,"card");
c.append(el("div",icon),el("h3",name),el("p",desc));
c.onclick=()=>show(name);
grid.appendChild(c);
});
content.appendChild(grid);
const p=panel("Welcome to PE Faculty Hub");
p.appendChild(el("p",
"Organize your teaching materials, deadlines, and academic activities in one place."));
}
function links(type,title){
const p=panel(title);
p.appendChild(el("p","Add links to Google Drive, PDFs, documents, or other online resources.","muted"));
const f=el("form",undefined,"form");
const name=el("input");
name.placeholder="Resource title";
name.required=true;
const url=el("input");
url.placeholder="https://...";
url.type="url";
url.required=true;
const add=el("button","Add Resource","primary");
add.type="submit";
f.append(name,url,add);
f.onsubmit=e=>{
e.preventDefault();
data[type].push({name:name.value.trim(),url:url.value.trim()});
save();show(current);
};
p.appendChild(f);
renderLinks(p,data[type],type);
}
function renderLinks(p,items,type){
if(!items.length){
p.appendChild(el("p","No resources added yet.","muted"));
return;
}
items.forEach(item=>{
const row=el("div",undefined,"item");
const d=el("div",undefined,"details");
const a=el("a",item.name);
a.href=item.url;
a.target="_blank";
a.rel="noopener noreferrer";
d.appendChild(a);
row.append(d);
if(type){
row.appendChild(button("Remove",()=>{
if(!confirm("Remove this resource?"))return;
data[type]=data[type].filter(x=>x!==item);
save();show(current);
}));
}
p.appendChild(row);
});
}
function directory(){
const p=panel("All Resource Links");
p.appendChild(el("h3","Learning Guides"));
renderLinks(p,data.guides);
p.appendChild(el("h3","Forms & Rubrics"));
renderLinks(p,data.forms);
}
function tasks(){
const p=panel("My Tasks");
const f=el("form",undefined,"form");
const name=el("input");
name.placeholder="Task description";
name.required=true;
const date=el("input");
date.type="date";
const add=el("button","Add Task","primary");
add.type="submit";
f.append(name,date,add);
f.onsubmit=e=>{
e.preventDefault();
data.tasks.push({
name:name.value.trim(),
date:date.value,
done:false
});
save();show(current);
};
p.appendChild(f);
data.tasks.forEach(t=>{
const row=el("div",undefined,"item");
const d=el("div",undefined,"details");
const title=el("strong",t.name,t.done?"done":"");
d.append(title,el("span",t.date||"No deadline"));
const actions=el("div",undefined,"actions");
actions.append(
button(t.done?"Undo":"Complete",()=>{
t.done=!t.done;save();show(current);
}),
button("Remove",()=>{
data.tasks=data.tasks.filter(x=>x!==t);
save();show(current);
})
);
row.append(d,actions);
p.appendChild(row);
});
}
function events(){
const p=panel("Academic Calendar");
const f=el("form",undefined,"form");
const name=el("input");
name.placeholder="Event title";
name.required=true;
const date=el("input");
date.type="date";
date.required=true;
const add=el("button","Add Event","primary");
add.type="submit";
f.append(name,date,add);
f.onsubmit=e=>{
e.preventDefault();
data.events.push({name:name.value.trim(),date:date.value});
save();show(current);
};
p.appendChild(f);
const sorted=[...data.events].sort((a,b)=>a.date.localeCompare(b.date));
sorted.forEach(event=>{
const row=el("div",undefined,"item");
const d=el("div",undefined,"details");
d.append(el("strong",event.name),el("span",event.date));
row.append(d,button("Remove",()=>{
data.events=data.events.filter(x=>x!==event);
save();show(current);
}));
p.appendChild(row);
});
}
function placeholder(name){
const p=panel(name);
p.appendChild(el("p",
"This section is being prepared. Student records and grades will require secure private storage.",
"muted"));
}
function settings(){
const p=panel("Backup Your Workspace");
p.appendChild(el("p",
"Export your saved resource links, tasks, and calendar events as a JSON backup."));
p.appendChild(button("Export Backup",()=>{
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="pe-faculty-hub-backup.json";
a.click();
URL.revokeObjectURL(url);
},"primary"));
}
show("Dashboard");
</script>
</body>
</html>
